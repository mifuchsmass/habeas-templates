<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Habeas Petition Generator</title>
  <link rel="stylesheet" href="css/styles.css">
  
  <!-- CDN Dependencies -->
  <script src="https://cdn.jsdelivr.net/npm/pizzip@3.1.7/dist/pizzip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docxtemplater@3.50.0/build/docxtemplater.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docx-preview@0.3.3/dist/docx-preview.min.js"></script>
</head>
<body>

  <h2>Habeas Petition Generator</h2>

  <div class="field">
    <label for="jurisdiction">Jurisdiction:</label>
    <select id="jurisdiction">
      <option value="Massachusetts">Massachusetts</option>
      <option value="Connecticut">Connecticut</option>
      <option value="Maine">Maine</option>
      <option value="New Hampshire">New Hampshire</option>
      <option value="Rhode Island">Rhode Island</option>
      <option value="Vermont">Vermont</option>
    </select>
  </div>

  <div class="field">
    <label for="petition_type">Type of Habeas Petition:</label>
    <select id="petition_type">
      <option value="GO Class">GO Class Proceeding (GO Class)</option>
      <option value="Non-GO">Non-GO 1225/1226 Proceeding (Non-GO)</option>
    </select>
  </div>

  <!-- Petitioner Name Breakdown Row -->
  <div class="field">
    <label>Petitioner Name:</label>
    <div class="name-grid">
      <input type="text" id="petitioner_first_name" placeholder="First Name" value="Jane">
      <input type="text" id="petitioner_middle_name" placeholder="Middle" value="M.">
      <input type="text" id="petitioner_last_name" placeholder="Last Name" value="Doe">
      <input type="text" id="petitioner_suffix" placeholder="Suffix (Jr., III)" value="">
    </div>
  </div>

  <div class="field">
    <label for="defendant">Respondent / Defendant Name:</label>
    <input type="text" id="defendant" value="Department of Homeland Security">
  </div>

  <div class="field">
    <label for="case_number">Case Number:</label>
    <input type="text" id="case_number" value="2026-CV-04321">
  </div>

  <div class="action-row" style="display: flex; align-items: center; gap: 15px; margin-top: 10px;">
    <button class="btn-primary" style="width: auto; flex-shrink: 0;" onclick="generateHabeasPetition()">Generate &amp; Download Pleading (.docx)</button>
    <label style="display: inline-flex; align-items: center; gap: 6px; font-weight: normal; margin: 0; font-size: 13px; color: #555;">
      <input type="checkbox" id="show_preview" style="width: auto; margin: 0;">
      Select to see preview for viewing small test documents. DO NOT USE for large documents.
    </label>
  </div>

  <!-- Document Preview Container -->
  <div id="docx-preview-container"></div>

  <!-- Modular Scripts -->
  <script src="js/docx-engine.js"></script>
  <script src="js/habeas-app.js"></script>
</body>
</html>
