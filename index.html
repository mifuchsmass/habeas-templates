<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Habeas Petition Generator</title>
  <link rel="stylesheet" href="css/styles.css">
  
  <!-- CDN Dependencies -->
  <script src="https://cdn.jsdelivr.net/npm/pizzip@3.1.7/dist/pizzip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docxtemplater@3.50.0/build/docxtemplater.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docx-preview@0.3.3/dist/docx-preview.min.js"></script>
</head>
<body>

  <h2>Habeas Petition Generator</h2>

  <!-- ====================================================================== -->
  <!-- TIER 1: PINNED PRIMARY MASTER DATA (Always at the top)                 -->
  <!-- ====================================================================== -->
  <div class="primary-fields-section">
    <div class="field">
      <label for="jurisdiction">Jurisdiction:</label>
      <select id="jurisdiction" data-form-field="Jurisdiction">
        <option value="">Select jurisdiction…</option>
        <option value="Massachusetts">Massachusetts</option>
        <option value="Connecticut">Connecticut</option>
        <option value="Maine">Maine</option>
        <option value="New Hampshire">New Hampshire</option>
        <option value="Rhode Island">Rhode Island</option>
        <option value="Vermont">Vermont</option>
      </select>
    </div>

    <!-- Detention Facility (Dynamic options based on State) -->
    <div class="field" id="facility_field_wrapper">
      <label for="detention_facility">Detention Facility:</label>
      <select id="detention_facility" data-form-field="Detention Facility">
        <option value="">Select detention facility…</option>
        <option value="Plymouth">Plymouth (Plymouth County Correctional Facility)</option>
        <option value="Burlington">Burlington (Burlington ICE Office)</option>
        <option value="Boston">Boston (Boston Field Office)</option>
      </select>
    </div>

    <div class="field">
      <label for="petition_type">Type of Habeas Petition:</label>
      <select id="petition_type" data-form-field="Type of Habeas Petition">
        <option value="">Select petition type…</option>
        <option value="GO Class">GO Class Proceeding (GO Class)</option>
        <option value="Non-GO">Non-GO 1225/1226 Proceeding (Non-GO)</option>
      </select>
    </div>

    <!-- Petitioner Name Breakdown Row -->
    <div class="field">
      <label>Petitioner Name:</label>
      <div class="name-grid">
        <input type="text" id="petitioner_first_name" data-form-field="Petitioner First Name" placeholder="First Name" value="">
        <input type="text" id="petitioner_middle_name" data-form-field="Petitioner Middle Name" placeholder="Middle" value="">
        <input type="text" id="petitioner_last_name" data-form-field="Petitioner Last Name" placeholder="Last Name" value="">
        <input type="text" id="petitioner_suffix" data-form-field="Petitioner Suffix" placeholder="Suffix (Jr., III)" value="">
      </div>
    </div>

    <div class="field">
      <label for="defendant">Respondent / Defendant Name:</label>
      <input type="text" id="defendant" data-form-field="Defendant Name" placeholder="Respondent name" value="">
    </div>

    <div class="field">
      <label for="case_number">Case Number:</label>
      <input type="text" id="case_number" data-form-field="Case Number" placeholder="Case number" value="">
    </div>
  </div>

  <!-- ====================================================================== -->
  <!-- TIER 2: DISCOVERED CASE FACTS (Auto-populated from template in order)  -->
  <!-- ====================================================================== -->
  <div id="dynamic-fields-section" class="dynamic-fields-section" style="display: none;">
    <div class="dynamic-fields-header">
      <h3>📝 Case Facts &amp; Background Details</h3>
      <span class="dynamic-badge">Auto-Discovered</span>
    </div>
    <div id="dynamic-fields-container" class="dynamic-fields-grid"></div>
  </div>

  <!-- Action Command Center -->
  <div class="action-block">
    <!-- Primary Actions -->
    <div class="sandbox-actions">
      <button type="button" id="renderBtn" class="btn-render" disabled>Render Preview 👁️</button>
      <button type="button" id="downloadBtn" class="btn-download" disabled>Download Word Document 📥</button>
    </div>

    <!-- Secondary Utilities -->
    <div class="utility-actions">
      <button type="button" class="btn-secondary" onclick="FormStorage.save()" disabled>💾 Save Form Data (.json)</button>
      <button type="button" class="btn-secondary" onclick="FormStorage.openFileDialog()" disabled>📂 Load Saved Data</button>
    </div>
  </div>
  
  <div id="generation-status" class="generation-status" role="status" aria-live="polite"><p class="generation-state">Loading template fields…</p></div>

  <!-- Document Preview Container -->
  <div id="docx-preview-container"></div>

  <!-- Modular Scripts -->
  <script src="js/template-logic.js"></script>
  <script src="js/docx-engine.js"></script>
  <script src="js/habeas-app.js"></script>
</body>
</html>
